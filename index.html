<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moj jedilnik</title><style>:root{--bg:#fbf8f1;--card:#fffdf9;--text:#30342e;--green:#758b70;--rose:#a45d66;--line:#ded8cf;--soft:#edf2e9}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:auto;max-width:1200px;padding:20px;background:radial-gradient(circle at 10% 10%,rgba(232,200,77,.12),transparent 22%),radial-gradient(circle at 90% 20%,rgba(201,138,154,.10),transparent 22%),var(--bg);color:var(--text)}h1{color:var(--green);margin-bottom:4px}.sub{color:#73756f}button,select{padding:9px 13px;border:1px solid var(--line);border-radius:20px;background:white}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day,.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.meal{border-top:1px dashed var(--line);padding:9px 3px;cursor:pointer;border-radius:8px}.meal:hover{background:var(--soft)}small{color:var(--rose)}.total{color:var(--green);font-weight:700;margin-top:8px}.panel{display:none}.panel.on{display:block}.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:7px 0}dialog{border:0;border-radius:18px;max-width:620px;width:90%;padding:22px}dialog::backdrop{background:#0006}.close{float:right}@media(max-width:800px){.grid,.shop{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.shop{grid-template-columns:1fr}}</style></head><body><h1>🍋 Moj jedilnik</h1><div class="sub">2 odrasla + 2 otroka · FA16–FA19</div><nav><button onclick="tab('menu')">Jedilnik</button><button onclick="tab('shop')">Nakupovalni seznam</button><button onclick="tab('prep')">Meal prep</button><select id="week"></select></nav><section id="menu" class="panel on"><div id="mg" class="grid"></div></section><section id="shop" class="panel"><div id="sg" class="shop"></div></section><section id="prep" class="panel"><div id="pg" class="shop"></div></section><dialog id="dlg"><button class="close" onclick="dlg.close()">×</button><h2 id="rt"></h2><small id="rm"></small><h3>Sestavine</h3><p id="ri">Podrobne sestavine iz receptov FA16–FA19 dodajamo postopoma.</p><h3>Priprava</h3><p id="rp">Celoten postopek priprave bo dodan v naslednji posodobitvi.</p></dialog><script>const weeks=[{name:'1. teden',days:[['Ponedeljek','Tortilja z jajcem, feta sirom in avokadom','FA17 / stran 8','410 kcal','Piščančje kroglice z rižem, zelenjavo in limonino omako','FA17 / stran 24','440 kcal','Odprt cezarjev wrap','FA17 / stran 42','450 kcal','1.300 kcal'],['Torek','Ovsena kaša z limono in makom','FA19 / stran 8','390 kcal','Marry me piščančja rižota','FA19 / stran 24','460 kcal','Mlečni riž s pečenimi breskvami','FA19 / stran 44','430 kcal','1.280 kcal'],['Sreda','Umešana jajca s šparglji in skuto','FA16 / stran 8','400 kcal','Tunine kroglice z zelenjavno omako in testeninami','FA16 / stran 24','400 kcal','Tunina rolca','FA16 / stran 40','440 kcal','1.240 kcal'],['Četrtek','Vanilijev kozarček s svežimi jagodami','FA18 / stran 8','290 kcal','Burger s piščančjim polpetom','FA18 / stran 24','420 kcal','Bučkina palačinka','FA18 / stran 40','470 kcal','1.180 kcal'],['Petek','Jajčno-avokadov namaz z zrnatim sirom','FA19 / stran 9','400 kcal','Piščančja solata s čičeriko in jajcem','FA19 / stran 26','430 kcal','Testeninska pesto solata s tuno in zelenjavo','FA19 / stran 46','400 kcal','1.230 kcal'],['Sobota','Skutna quesadilla s hruško','FA18 / stran 8','430 kcal','Ribji curry z riževimi rezanci','FA18 / stran 24','400 kcal','Lečin daal z rižem','FA18 / stran 44','400 kcal','1.230 kcal'],['Nedelja','Pirini kosmiči z datlji, arašidovim maslom in temno čokolado','FA16 / stran 9','390 kcal','Piščančji file s šampinjoni in pire krompirjem','FA16 / stran 25','430 kcal','Krompirjeve palačinke','FA16 / stran 40','430 kcal','1.250 kcal']],shop:{'Sadje in zelenjava':[['Avokado','4 kosi'],['Limone','5–6 kosov'],['Šparglji','~500 g'],['Jagode','500 g'],['Hruške','5 kosov'],['Krompir','3 kg'],['Šampinjoni','700 g']],'Meso, ribe in beljakovine':[['Piščančji file/prsa','~3 kg'],['Tuna','6–7 konzerv'],['Bela riba','500–600 g'],['Jajca','20 kosov'],['Čičerika','2 konzervi']],'Mlečno in hlajeno':[['Feta','250–300 g'],['Zrnati sir','700–800 g'],['Skuta','750 g'],['Skyr/grški jogurt','1,5 kg']],'Žita in pekovsko':[['Tortilje','2 paketa'],['Ovseni kosmiči','500 g'],['Riž','1,5 kg'],['Testenine','1 kg']]}},{name:'2. teden',days:[['Ponedeljek','Sendvič s piščančjimi prsmi in pršutom','FA19 / stran 20','390 kcal','Piščančji medaljoni s pomfrijem','FA19 / stran 28','420 kcal','Piščančja solata s hrustljavo koruzo','FA19 / stran 49','420 kcal','1.230 kcal'],['Torek','Ovsena pica iz ponve','FA17 / stran 9','430 kcal','Piščančji zrezek z zelenjavno-krompirjevo solato','FA17 / stran 26','410 kcal','Lososova testeninska solata','FA17 / stran 52','420 kcal','1.260 kcal'],['Sreda','Proteinska kaša z višnjevim džemom in cimetom','FA16 / stran 14','450 kcal','Piščančji koščki v medeni čili omaki','FA16 / stran 27','420 kcal','Piščančja solata z jajčnim prelivom','FA16 / stran 49','420 kcal','1.290 kcal'],['Četrtek','Skyr s hibiskusovo poširano hruško','FA18 / stran 12','340 kcal','Žitna skleda s piščancem in zelenjavo','FA18 / stran 25','400 kcal','Pirin vafelj z višnjevo omako in skyrom','FA18 / stran 45','400 kcal','1.140 kcal'],['Petek','Pečeni ovseni kosmiči z banano in datljevo karamelo','FA19 / stran 12','420 kcal','Sladek čili piščanec z rižem','FA19 / stran 29','460 kcal','Korenčkov wrap z zrnatim sirom, lososom in rukolo','FA19 / stran 46','440 kcal','1.320 kcal'],['Sobota','Jabolčni crumble','FA16 / stran 14','380 kcal','Lososova skleda s pečenim krompirjem','FA16 / stran 30','400 kcal','Piščančji curry z ovsenim mlekom','FA16 / stran 45','430 kcal','1.210 kcal'],['Nedelja','Ovsena kaša s pistacijinim maslom','FA18 / stran 13','380 kcal','Zelena solata s piščancem in testeninami','FA18 / stran 29','420 kcal','Proteinska mango tortica z jagodnim džemom','FA18 / stran 53','400 kcal','1.200 kcal']],shop:{'Sadje in zelenjava':[['Hruške','5–6 kosov'],['Banane','8 kosov'],['Višnje','600–700 g'],['Krompir','3,5 kg'],['Rukola','2 vrečki']],'Meso, ribe in beljakovine':[['Piščančji file/prsa','3,5–4 kg'],['Pršut','250 g'],['Losos','1,4–1,6 kg'],['Jajca','18 kosov']],'Mlečno in hlajeno':[['Skyr/grški jogurt','1,5–2 kg'],['Zrnati sir','600–700 g'],['Skuta','500 g']],'Žita in pekovsko':[['Kruh','1–2 hlebca'],['Ovseni kosmiči','700 g'],['Riž','1,5 kg'],['Testenine','1,2 kg'],['Tortilje','2 paketa']]}}];const w=document.querySelector('#week'),mg=document.querySelector('#mg'),sg=document.querySelector('#sg'),pg=document.querySelector('#pg'),dlg=document.querySelector('#dlg');weeks.forEach((x,i)=>w.add(new Option(x.name,i)));function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.querySelector('#'+id).classList.add('on')}function rec(n,s,k){rt.textContent=n;rm.textContent=s+' · '+k;dlg.showModal()}function ck(t,id){return `<label><input type=checkbox ${localStorage[id]?'checked':''} onchange="this.checked?localStorage.setItem('${id}','1'):localStorage.removeItem('${id}')"> ${t}</label>`}function render(){let wi=+w.value,x=weeks[wi];mg.innerHTML=x.days.map(d=>`<div class=day><b>${d[0]}</b>${[[1,2,3,'Zajtrk'],[4,5,6,'Kosilo'],[7,8,9,'Večerja']].map(a=>`<div class=meal><small>${a[3]}</small><br><b>${d[a[0]]}</b><br><small>${d[a[1]]} · ${d[a[2]]}</small></div>`).join('')}<div class=total>${d[10]}</div></div>`).join('');mg.querySelectorAll('.meal').forEach((el,i)=>{let d=x.days[Math.floor(i/3)],a=[[1,2,3],[4,5,6],[7,8,9]][i%3];el.onclick=()=>rec(d[a[0]],d[a[1]],d[a[2]])});sg.innerHTML=Object.entries(x.shop).map(([c,it],ci)=>`<div class=box><b>${c}</b>${it.map((z,j)=>ck(z[0]+' · '+z[1],`s${wi}-${ci}-${j}`)).join('')}</div>`).join('');pg.innerHTML=x.days.map((d,di)=>`<div class=box><b>${d[0]}</b>${ck('Zajtrk: '+d[1],`p${wi}-${di}-1`)}${ck('Kosilo: '+d[4],`p${wi}-${di}-2`)}${ck('Večerja: '+d[7],`p${wi}-${di}-3`)}</div>`).join('')}w.onchange=render;render()</script></body></html>
